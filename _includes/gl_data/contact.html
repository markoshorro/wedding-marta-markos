<section id="contact">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading">Contacto</h2>
            </div>
        </div>
        <div class="row" style="color: white">
                <h3 class="section-subheading text-muted">Ou envía un correo a <a href="mailto:horrorivasfamily@gmail.com">horrorivasfamily@gmail.com</a>.
                <br>Preferiblemente, contáctanos por teléfono móbil, que xa deberías ter os nosos números gardados ;-)</h3>
        </div>
        <div class="row">
            <div class="col-lg-12">

                <form target="_blank" action="https://formsubmit.co/horrorivasfamily@gmail.com" method="POST">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="control-group form-group">
                                <input type="text" class="form-control" placeholder="Nome completo" id="name" name="name" required data-validation-required-message="Escribe o teu nome completo, por favor.">
                                <p class="help-block text-danger"></p>
                            </div>
                            <div class="control-group form-group">
                                <input type="email" class="form-control" placeholder="Teu enderezo electrónico" id="email" name="email" required data-validation-required-message="Escribe o teu enderezo electrónico, por favor.">
                                <p class="help-block text-danger"></p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="control-group form-group">
                                <textarea class="form-control" placeholder="A túa mensaxe" id="message" name="message" required data-validation-required-message="Cal é a túa mensaxe?"></textarea>
                                <p class="help-block text-danger"></p>
                            </div>
                        </div>
                        <div class="clearfix"></div>
                        <div class="col-lg-12 text-center">
                            <div id="success"></div>
                            <button type="submit" class="btn btn-xl">Enviar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
