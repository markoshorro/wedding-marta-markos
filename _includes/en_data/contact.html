<section id="contact">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading">Contact Us</h2>
            </div>
        </div>
        <div class="row" style="color: white">
                <h3 class="section-subheading text-muted">Or send us an email at <a href="mailto:horrorivasfamily@gmail.com">horrorivasfamily@gmail.com</a>.
                <br>Preferable, send us a text message to one our mobile phones (you should know them :-P).</h3>
        </div>
        <div class="row">
            <div class="col-lg-12">

                <form target="_blank" action="https://formsubmit.co/horrorivasfamily@gmail.com" method="POST">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="control-group form-group">
                                <input type="text" class="form-control" placeholder="Full Name" id="name" name="name" required data-validation-required-message="Write your full name, please.">
                                <p class="help-block text-danger"></p>
                            </div>
                            <div class="control-group form-group">
                                <input type="email" class="form-control" placeholder="Your Email" id="email" name="email" required data-validation-required-message="Write your email, please.">
                                <p class="help-block text-danger"></p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="control-group form-group">
                                <textarea class="form-control" placeholder="Your message" id="message" name="message" required data-validation-required-message="What's your message?"></textarea>
                                <p class="help-block text-danger"></p>
                            </div>
                        </div>
                        <div class="clearfix"></div>
                        <div class="col-lg-12 text-center">
                            <div id="success"></div>
                            <button type="submit" class="btn btn-xl">Submit Form</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
