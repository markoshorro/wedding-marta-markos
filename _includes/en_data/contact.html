<section id="contact">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading">Contact Us</h2>
                <h3 class="section-subheading text-muted">Or send us an email at <a href="mailto:horrorivasfamily@gmail.com">horrorivasfamily@gmail.com</a>.</h3>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-12">
                <form target="_blank" action="https://formsubmit.co/horrorivasfamily@gmail.com" method="POST">
                    <div class="form-group">
                      <div class="form-row">
                        <div class="col">
                          <input type="text" name="name" class="form-control" placeholder="Full Name" required>
                        </div>
                        <div class="col">
                          <input type="email" name="email" class="form-control" placeholder="Email Address" required>
                        </div>
                      </div>
                    </div>
                    <div class="form-group">
                      <textarea placeholder="Your Message" class="form-control" name="message" rows="10" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-lg btn-dark btn-block">Submit Form</button>
                  </form>
            </div>
        </div>
    </div>
</section>
